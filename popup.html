<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>PegaVaga</title>
    <style>
      :root {
        --bg: #0a66c2;
        --bg-dark: #004182;
        --ok: #1f9d55;
        --warn: #b7791f;
        --error: #c53030;
        --text: #1f2933;
        --muted: #64748b;
        --line: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 340px;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        font-size: 13px;
        color: var(--text);
        background: #f8fafc;
      }

      header {
        background: var(--bg);
        color: #fff;
        padding: 12px 14px;
      }

      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      header p {
        margin: 2px 0 0;
        font-size: 11px;
        opacity: 0.85;
      }

      main {
        padding: 12px 14px 14px;
      }

      .counter {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }

      .counter .value {
        font-size: 26px;
        font-weight: 700;
        color: var(--bg-dark);
        line-height: 1;
      }

      .counter .label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }

      .counter .lastrun {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        color: var(--muted);
      }

      button {
        display: block;
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 8px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, opacity 0.15s ease;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #btn-start {
        background: var(--bg);
        color: #fff;
      }
      #btn-start:hover:not(:disabled) {
        background: var(--bg-dark);
      }

      #btn-stop {
        background: #e2e8f0;
        color: #334155;
      }
      #btn-stop:hover:not(:disabled) {
        background: #cbd5e1;
      }

      #btn-export {
        background: var(--ok);
        color: #fff;
      }
      #btn-export:hover:not(:disabled) {
        background: #167a41;
      }

      #btn-clear {
        background: transparent;
        color: var(--muted);
        font-weight: 500;
        font-size: 11px;
        padding: 6px;
        margin-bottom: 0;
      }
      #btn-clear:hover:not(:disabled) {
        color: var(--error);
      }

      .status {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 11px;
        line-height: 1.4;
        background: #eef2f7;
        color: var(--muted);
        min-height: 18px;
      }

      .status.ok {
        background: #e6ffed;
        color: var(--ok);
      }
      .status.warn {
        background: #fffaf0;
        color: var(--warn);
      }
      .status.error {
        background: #fff5f5;
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PegaVaga</h1>
      <p>Rastreamento de vagas do LinkedIn</p>
    </header>

    <main>
      <div class="counter">
        <div>
          <span class="value" id="count">0</span>
          <span class="label">&nbsp;vagas capturadas</span>
          <span class="lastrun" id="last-run">Nenhuma varredura realizada</span>
        </div>
      </div>

      <button id="btn-start" type="button">▶ Iniciar Varredura/Extração</button>
      <button id="btn-stop" type="button" disabled>■ Parar Varredura</button>
      <button id="btn-export" type="button">⬇ Exportar para Excel (CSV)</button>
      <button id="btn-clear" type="button">🗑 Limpar vagas capturadas</button>

      <div class="status" id="status">
        Abra a lista de vagas do LinkedIn (/jobs/search/) e clique em iniciar.
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
